# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - wealth-assistant

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          npm install
          if ($LASTEXITCODE -ne 0) { throw "npm install (root) failed with exit code $LASTEXITCODE" }

          npm install --prefix client
          if ($LASTEXITCODE -ne 0) { throw "npm install (client) failed with exit code $LASTEXITCODE" }

          npm run build --if-present
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed with exit code $LASTEXITCODE" }

          npm run test --if-present
          if ($LASTEXITCODE -ne 0) { throw "npm run test failed with exit code $LASTEXITCODE" }
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_84EBF26307964FA0854C4AE87F0D7DEF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_37DC436747E149FA808A8BB38DE85312 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_29FF3049CBA84423A16BD8EB0EA681EA }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'wealth-assistant'
          slot-name: 'Production'
          package: .
          
